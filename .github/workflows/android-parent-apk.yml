name: Parent APK Build

on:
  push:
    branches:
      - feature/parent-app-refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parent-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and package parent Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew
        working-directory: android-parent-app

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android-parent-app

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: al-umrabi-parent-debug-apk
          path: android-parent-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
