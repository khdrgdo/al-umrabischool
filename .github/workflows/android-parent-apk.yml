name: Parent App Build and Emulator Smoke Test

on:
  push:
    branches:
      - feature/parent-app-refresh
      - feature/orb-v2-premium-redesign
      - feature/parent-app-ux-rebuild
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build and publish parent APK
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK and run unit tests
        working-directory: android-parent-app
        run: .\gradlew.bat --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: al-omrabi-parent-app-v3-debug-apk
          path: android-parent-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke-test:
    name: Install and launch on Android 15 emulator
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download exact APK built in previous job
        uses: actions/download-artifact@v4
        with:
          name: al-omrabi-parent-app-v3-debug-apk
          path: artifacts

      - name: Boot Android 15 emulator and verify app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r artifacts/app-debug.apk
            adb shell am start -W -n sd.alumrabi.parent.debug/sd.alumrabi.parent.MainActivity
            for i in $(seq 1 30); do
              if adb shell pidof sd.alumrabi.parent.debug >/dev/null 2>&1; then break; fi
              sleep 1
            done
            sleep 8
            test -n "$(adb shell pidof sd.alumrabi.parent.debug | tr -d '\\r')"
            adb shell dumpsys activity activities | grep -q 'sd.alumrabi.parent.MainActivity'
            if adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi
