name: Parent App Build and Emulator Smoke Test

on:
  push:
    branches:
      - feature/parent-app-refresh
      - feature/orb-v2-premium-redesign
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build-and-smoke-test:
    name: Build APK and launch on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android-parent-app
        run: bash ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Install and smoke-test on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r android-parent-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n sd.alumrabi.parent.debug/sd.alumrabi.parent.MainActivity
            for i in $(seq 1 30); do
              if adb shell pidof sd.alumrabi.parent.debug >/dev/null 2>&1; then break; fi
              sleep 1
            done
            sleep 8
            adb shell uiautomator dump --compressed /sdcard/omrabi-window.xml
            adb pull /sdcard/omrabi-window.xml /tmp/omrabi-window.xml
            grep -q 'مرحباً بعودتك' /tmp/omrabi-window.xml
            if adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: al-omrabi-parent-app-v3-release-candidate
          path: android-parent-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
