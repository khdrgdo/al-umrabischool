name: Android Emulator Screenshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo or login"
        default: "demo"
      account:
        description: "account code (login mode)"
        default: ""
      password:
        description: "password (login mode, test account only)"
        default: ""
  push:
    branches: [feature/parent-app-v1.2.1]
    paths:
      - ".github/workflows/android-screenshots.yml"
      - "android-parent-app/scripts/shoot.py"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        working-directory: ./android-parent-app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SHOT_MODE: ${{ github.event.inputs.mode || 'demo' }}
          ACCT: ${{ github.event.inputs.account }}
          PW: ${{ github.event.inputs.password }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 android-parent-app/scripts/shoot.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alumrabi-screenshots
          path: shots/
          if-no-files-found: warn
