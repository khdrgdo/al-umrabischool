name: Continuous Integration & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-verification:
    name: Web Quality, Security & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Run Vitest Real Test Suite (10 Comprehensive Suites)
        run: npm test

      - name: Build Web Application (SSR & Nitro Module)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://c--8b91830b-7424-4960-81c7-67e94cdfd28d-prod.lovable.cloud' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Cfv0pugkUHNlXrkWNX45JQ_ebr24viE' }}

  android-verification:
    name: Android Parent Mobile App Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android-parent-app/gradlew

      - name: Assemble Debug APK
        working-directory: ./android-parent-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alumrabi-parent-app-debug
          path: android-parent-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
